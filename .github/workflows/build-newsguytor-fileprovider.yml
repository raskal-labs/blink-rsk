name: Build native SideStore Blink File Provider candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep this candidate tied to the already-audited public Blink 18.7 source.
  BLINK_SOURCE_COMMIT: a90b4423c8b7a86770c24a7eaa6c13b0a5904b18
  BLINK_EXPECTED_VERSION: 18.7.0
  BLINK_EXPECTED_BUNDLE_ID: sh.blink.blinkshell
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select and verify Xcode
        run: |
          set -euxo pipefail
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          test "$(xcode-select -p)" = "$XCODE_DEVELOPER_DIR"
          xcodebuild -version | tee xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee iphoneos-sdk.txt

      - name: Prepare exact upstream source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/blinksh/blink.git blink
          git -C blink checkout --force "$BLINK_SOURCE_COMMIT"
          test "$(git -C blink rev-parse HEAD)" = "$BLINK_SOURCE_COMMIT"
          git -C blink submodule sync --recursive
          git -C blink submodule update --init --recursive
          printf '%s\n' "$BLINK_SOURCE_COMMIT" > blink-commit.txt
          git -C blink submodule status --recursive > submodules.txt

          cd blink
          ./get_frameworks.sh 2>&1 | tee ../frameworks.log
          ./get_resources.sh 2>&1 | tee ../resources.log
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/
          cp template_setup.xcconfig developer_setup.xcconfig
          cmp -s template_setup.xcconfig developer_setup.xcconfig
          # Resource preparation is an upstream build prerequisite and may
          # update tracked generated assets. Record that baseline so the next
          # step can prove the exact additional repair source scope.
          git diff --name-only | sort > ../prepared-source-changes.txt

      - name: Apply and test the scoped foundation and complete customization batch
        run: |
          set -euxo pipefail
          python3 scripts/patch-sidestore-app-groups.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-sidestore-app-groups.py "$GITHUB_WORKSPACE/blink"
          # Tests patch isolated copies before the real source is changed.
          python3 scripts/test-bookmark-recovery.py "$GITHUB_WORKSPACE/blink" 2>&1 | tee bookmark-checks.log
          python3 scripts/patch-bookmark-recovery.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-session-actions.py "$GITHUB_WORKSPACE/blink" 2>&1 | tee session-checks.log
          python3 scripts/patch-session-actions.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-fileprovider-startup-cleanup.py "$GITHUB_WORKSPACE/blink" 2>&1 | tee fileprovider-checks.log
          python3 scripts/patch-fileprovider-startup-cleanup.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-terminal-input-gestures.py "$GITHUB_WORKSPACE/blink" 2>&1 | tee terminal-checks.log
          python3 scripts/patch-terminal-input-gestures.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-shortcuts-expansion.py "$GITHUB_WORKSPACE/blink" 2>&1 | tee shortcuts-checks.log
          python3 scripts/patch-shortcuts-expansion.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-customization.py "$GITHUB_WORKSPACE/blink" 2>&1 | tee customization-checks.log
          python3 scripts/patch-customization-model.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/patch-customization-input.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/patch-customization-workspace.py "$GITHUB_WORKSPACE/blink"
          # Include exactly the reviewed new main-app sources and local input headers.
          git -C blink add --intent-to-add -- Blink/SessionLink.swift Blink/BlinkIntents.swift Blink/ShortcutsRunner.swift Blink/ShortcutsFiles.swift Blink/Terminal/WorkbenchInputDelivery.h Blink/Terminal/WorkbenchInputDelivery.m Blink/Terminal/WorkbenchWriteStep.h Blink/WorkbenchDPadView.swift Blink/WorkbenchDock.swift Blink/WorkbenchModel.swift Blink/WorkbenchUI.swift
          git -C blink diff --check
          git -C blink diff --name-only | sort > source-modified-files.txt
          comm -13 prepared-source-changes.txt source-modified-files.txt > sidestore-patch-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
            "Blink.xcodeproj/project.pbxproj",
            "Blink/BlinkIntents.swift",
            "Blink/SceneDelegate.swift",
            "Blink/SessionLink.swift",
            "Blink/ShortcutsFiles.swift",
            "Blink/ShortcutsRunner.swift",
            "Blink/SmarterKeys/KBView.swift",
            "Blink/SmarterKeys/SmarterTermInput.swift",
            "Blink/SpaceController.swift",
            "Blink/Terminal/LayoutConstraintManager.h",
            "Blink/Terminal/LayoutConstraintManager.m",
            "Blink/Terminal/TermController.swift",
            "Blink/Terminal/TermDevice.h",
            "Blink/Terminal/TermDevice.m",
            "Blink/Terminal/TermView.h",
            "Blink/Terminal/TermView.m",
            "Blink/Terminal/WorkbenchInputDelivery.h",
            "Blink/Terminal/WorkbenchInputDelivery.m",
            "Blink/Terminal/WorkbenchWriteStep.h",
            "Blink/WebKit/WKWebView.swift",
            "Blink/WorkbenchDPadView.swift",
            "Blink/WorkbenchDock.swift",
            "Blink/WorkbenchModel.swift",
            "Blink/WorkbenchUI.swift",
            "BlinkConfig/XCConfig.m",
            "BlinkFileProvider/FileProviderReplicatedExtension.swift",
            "Resources/term.js",
            "SSH/SFTP.swift",
            "Settings/Model/BookmarkedLocationsManager.swift",
            "Settings/SettingsView.swift",
            "Settings/ViewControllers/BookmarkedLocations/BookmarkedLocationsView.swift",
          }
          assert set(Path("sidestore-patch-files.txt").read_text().splitlines()) == expected
          PY
          git -C blink diff --no-ext-diff --binary -- Blink.xcodeproj/project.pbxproj Blink/BlinkIntents.swift Blink/SceneDelegate.swift Blink/SessionLink.swift Blink/ShortcutsFiles.swift Blink/ShortcutsRunner.swift Blink/SmarterKeys/KBView.swift Blink/SmarterKeys/SmarterTermInput.swift Blink/SpaceController.swift Blink/Terminal/LayoutConstraintManager.h Blink/Terminal/LayoutConstraintManager.m Blink/Terminal/TermController.swift Blink/Terminal/TermDevice.h Blink/Terminal/TermDevice.m Blink/Terminal/TermView.h Blink/Terminal/TermView.m Blink/Terminal/WorkbenchInputDelivery.h Blink/Terminal/WorkbenchInputDelivery.m Blink/Terminal/WorkbenchWriteStep.h Blink/WebKit/WKWebView.swift Blink/WorkbenchDPadView.swift Blink/WorkbenchDock.swift Blink/WorkbenchModel.swift Blink/WorkbenchUI.swift BlinkConfig/XCConfig.m BlinkFileProvider/FileProviderReplicatedExtension.swift Resources/term.js SSH/SFTP.swift Settings/Model/BookmarkedLocationsManager.swift Settings/SettingsView.swift Settings/ViewControllers/BookmarkedLocations/BookmarkedLocationsView.swift > source-patches.diff
          (cd blink && shasum -a 256 Blink.xcodeproj/project.pbxproj Blink/BlinkIntents.swift Blink/SceneDelegate.swift Blink/SessionLink.swift Blink/ShortcutsFiles.swift Blink/ShortcutsRunner.swift Blink/SmarterKeys/KBView.swift Blink/SmarterKeys/SmarterTermInput.swift Blink/SpaceController.swift Blink/Terminal/LayoutConstraintManager.h Blink/Terminal/LayoutConstraintManager.m Blink/Terminal/TermController.swift Blink/Terminal/TermDevice.h Blink/Terminal/TermDevice.m Blink/Terminal/TermView.h Blink/Terminal/TermView.m Blink/Terminal/WorkbenchInputDelivery.h Blink/Terminal/WorkbenchInputDelivery.m Blink/Terminal/WorkbenchWriteStep.h Blink/WebKit/WKWebView.swift Blink/WorkbenchDPadView.swift Blink/WorkbenchDock.swift Blink/WorkbenchModel.swift Blink/WorkbenchUI.swift BlinkConfig/XCConfig.m BlinkFileProvider/FileProviderReplicatedExtension.swift Resources/term.js SSH/SFTP.swift Settings/Model/BookmarkedLocationsManager.swift Settings/SettingsView.swift Settings/ViewControllers/BookmarkedLocations/BookmarkedLocationsView.swift) > patched-source-SHA256SUMS
          shasum -a 256 patches/*.patch scripts/*.py scripts/customization-paths.json scripts/customization-combined-paths.json tests/bookmarks/*.swift tests/session-actions/*.swift tests/shortcuts/*.swift tests/customization/* > patch-SHA256SUMS
          git archive --format=tar.gz --output=harness-source.tar.gz HEAD

      - name: Resolve packages and build complete Release app
        working-directory: blink
        run: |
          set -o pipefail
          xcodebuild -project Blink.xcodeproj -scheme Blink \
            -clonedSourcePackagesDirPath ../SourcePackages \
            -resolvePackageDependencies 2>&1 | tee ../packages.log
          xcodebuild -project Blink.xcodeproj -scheme Blink \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ../DerivedData \
            -clonedSourcePackagesDirPath ../SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee ../xcodebuild.log

      - name: Stage complete app and sign SideStore capability requests
        run: |
          set -euxo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name Blink.app -print -quit)"
          test -n "$APP"
          rm -rf stage artifact
          mkdir -p stage/Payload artifact
          cp -R "$APP" stage/Payload/Blink.app
          APP="$GITHUB_WORKSPACE/stage/Payload/Blink.app"
          FP="$APP/PlugIns/BlinkFileProviderExtension.appex"
          FPUI="$APP/PlugIns/BlinkFileProviderExtensionUI.appex"
          test -d "$FP"
          test -d "$FPUI"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$APP" -type f -name embedded.mobileprovision -delete

          # SideSign filters profile entitlements through these pre-signing
          # requests. Both the app and non-UI File Provider must name the
          # same keychain suffix, otherwise the extension cannot read Blink's
          # credentials after SideStore has assigned its team prefix.
          cat > artifact/main-requested.entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.default-data-protection</key><string>NSFileProtectionComplete</string>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.application-groups</key><array><string>group.sh.blink</string></array>
            <key>com.apple.security.device.bluetooth</key><true/>
            <key>com.apple.security.device.camera</key><true/>
            <key>com.apple.security.files.user-selected.read-write</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
            <key>com.apple.security.personal-information.location</key><true/>
            <key>keychain-access-groups</key><array><string>PRE_SIGNING_PREFIX.sh.blink</string></array>
          </dict></plist>
          EOF
          cat > artifact/fileprovider-requested.entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.application-groups</key><array><string>group.sh.blink</string></array>
            <key>com.apple.security.network.client</key><true/>
            <key>keychain-access-groups</key><array><string>PRE_SIGNING_PREFIX.sh.blink</string></array>
          </dict></plist>
          EOF
          cat > artifact/fileprovider-ui-requested.entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.application-groups</key><array><string>group.sh.blink</string></array>
          </dict></plist>
          EOF
          plutil -lint artifact/*requested.entitlements.plist

          while IFS= read -r code; do codesign --force --sign - "$code"; done < <(find "$APP/Frameworks" -maxdepth 2 \( -name '*.framework' -o -name '*.dylib' \) -print | sort)
          codesign --force --sign - --entitlements artifact/fileprovider-requested.entitlements.plist "$FP"
          codesign --force --sign - --entitlements artifact/fileprovider-ui-requested.entitlements.plist "$FPUI"
          codesign --force --sign - --entitlements artifact/main-requested.entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee artifact/codesign-verify.txt

          codesign -d --entitlements :- "$APP" > artifact/main-embedded-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$FP" > artifact/fileprovider-embedded-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$FPUI" > artifact/fileprovider-ui-embedded-entitlements.plist 2>/dev/null
          for file in artifact/*embedded-entitlements.plist; do
            plutil -lint "$file"
            grep -q 'group.sh.blink' "$file"
          done
          for file in artifact/main-embedded-entitlements.plist artifact/fileprovider-embedded-entitlements.plist; do
            grep -q 'PRE_SIGNING_PREFIX.sh.blink' "$file"
          done

      - name: Validate and package candidate
        run: |
          set -euxo pipefail
          APP="$GITHUB_WORKSPACE/stage/Payload/Blink.app"
          FP="$APP/PlugIns/BlinkFileProviderExtension.appex"
          FPUI="$APP/PlugIns/BlinkFileProviderExtensionUI.appex"
          id() { /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$1/Info.plist"; }
          test "$(id "$APP")" = "$BLINK_EXPECTED_BUNDLE_ID"
          test "$(id "$FP")" = 'sh.blink.blinkshell.BlinkFileProviderExtension'
          test "$(id "$FPUI")" = 'sh.blink.blinkshell.BlinkFileProviderExtensionUI'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionFileProviderDocumentGroup' "$FP/Info.plist")" = 'group.sh.blink'
          test "$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')" = 2
          test -z "$(find "$APP" -type f -name embedded.mobileprovision -print -quit)"
          find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' -print | sort > artifact/extensions.txt
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          IPA="artifact/Blink-SideStore-${VERSION}-${BUILD}-native-fileprovider.ipa"
          (cd stage && zip -qry "../$IPA" Payload)
          unzip -t "$IPA"
          shasum -a 256 "$IPA" > artifact/SHA256SUMS
          cp blink-commit.txt source-patches.diff prepared-source-changes.txt source-modified-files.txt sidestore-patch-files.txt patched-source-SHA256SUMS patch-SHA256SUMS harness-source.tar.gz artifact/
          export VERSION BUILD
          python3 - <<'PY'
          import json, os
          json.dump({
            "schema": 6,
            "artifact": "Blink full customization candidate on accepted Shortcuts/provider foundation",
            "harness_commit": os.environ["GITHUB_SHA"],
            "ci_run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
            "integration_source": "blinksh/blink@7a427f3db37ec25869b24226905d89103a8ad99d (selective adaptation; not a source upgrade)",
            "fileprovider_repair_source": "blinksh/blink@7e28d1721ecb6614951040477036ef31d5a0964e (exact one-line backport; no domain reset)",
            "patch_files": open("sidestore-patch-files.txt").read().splitlines(),
            "terminal_correction_sources": ["blinksh/blink@9e8767b75df35571012140ffe509fb8259cb908e (only two Snips resign lines)", "madjinn/blink@a31aa977e297c9c4a2c3a54e6a3d9b191cf17a85 (only gesture-detach correction)"],
            "execution_contract": "Foreground only; strict known-host verification, existing signers/agent/password/challenges; 60s action deadline, 256KiB per output channel, 16MiB files and 2000 listing entries. Cancellation may leave remote work/partial uploads. Blocking native I/O cleanup can lag action cancellation.",
            "saved_folders": "Existing bookmark scopes, new local terminal only; standalone Files navigation unsupported by inspected source",
            "build_authority": "Customization milestone: verify current bounded user build authorization before manual dispatch; no installation or merge",
            "withdrawn_report": "October 26 Files sync failure withdrawn by user; no successful transfer test inferred",
            "customization_sources": "Three guarded model/input/workspace patches; ShogunPanda c1bff729 D-pad panel + existing key path only; retained-row helper correction; no renderer or signing fork import",
            "native_validation": "macOS resolver/bookmark/session/provider/terminal/Shortcuts/customization suites, real Foundation FIFO/cancellation/pipe integration, full iOS Release compilation and native signature checks",
            "metadata_validation": "See app-intents-package-checks.json; absent receipt means the final metadata gate did not pass",
            "customization_contract": "Configurable dock/profiles/D-pad; input/keyboard modes; retained Select All/capture; bounded ordered input; session overview; workspace palette/hosts/bookmarks; draft-first appearance presets. Source/runtime/platform limits in customization evidence.",
            "device_acceptance": "Unknown; no installation performed",
            "upstream_commit": open("blink-commit.txt").read().strip(),
            "version": os.environ["VERSION"], "build": os.environ["BUILD"],
            "source_changes": [
              "BlinkConfig/XCConfig.m: resolve the installed profile's one provisioned Blink App Group",
              "BlinkFileProvider/FileProviderReplicatedExtension.swift: disable automatic startup temporary-file cleanup, retaining normal change polling",
              "Settings/Model/BookmarkedLocationsManager.swift: preserve unavailable bookmarks, retry/reselect, balance security scopes and filter shell paths",
              "Settings/ViewControllers/BookmarkedLocations/BookmarkedLocationsView.swift: show unavailable entries with Retry and folder reselection",
              "Blink/SessionLink.swift + Blink/BlinkIntents.swift: navigation-only links and eight foreground actions with output, files, Mosh, focus and saved folders",
              "Blink/SceneDelegate.swift + Blink/SpaceController.swift: route/confirm fresh or reused sessions; preserve Snips resign/dismiss focus and main-thread guard",
              "Blink.xcodeproj/project.pbxproj: register eight Swift and one Objective-C main-app sources across foundation and customization; no extension changes",
              "Blink/ShortcutsRunner.swift + Blink/ShortcutsFiles.swift: bounded foreground SSH/SFTP with returned results and cancellation",
              "SSH/SFTP.swift: exclusive file creation and bounded listing overload; existing callers retain semantics",
              "Blink/WebKit/WKWebView.swift: remove recognizers on detachment, retain attachment",
              "Blink/WorkbenchModel.swift + WorkbenchUI.swift + WorkbenchDock.swift + WorkbenchDPadView.swift: customization state, workspace, control profiles and reviewed D-pad",
              "Blink/Terminal/WorkbenchInputDelivery.* + WorkbenchWriteStep.h: bounded ordered nonblocking input with cancellation and errors",
              "Blink/SpaceController.swift + TermController.swift + SmarterTermInput.swift + KBView.swift: composed input modes, existing key path and serialized session controls",
              "Resources/term.js + TermView.*: retained-row selection/export and explicit paste-review gate",
              "LayoutConstraintManager.* + Settings/SettingsView.swift: dock space reservation and native customization entry"
            ],
            "side_store_contract": {
              "pre_signing_requests": "Main + File Provider share keychain suffix sh.blink and request group.sh.blink; SideStore supplies profile values and rewrites the File Provider document group.",
              "final_signer": "SideStore",
              "extensions": ["BlinkFileProviderExtension", "BlinkFileProviderExtensionUI"]
            },
            "migration_safety": "Upstream migrations are unchanged. Do not update an existing installation until its App Group state and a restorable backup have been verified."
          }, open("artifact/build-manifest.json", "w"), indent=2)
          PY
          python3 scripts/validate-shortcuts-package.py "$IPA" artifact/app-intents-package-checks.json

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-SideStore-native-fileprovider-${{ github.run_number }}
          path: |
            artifact/
            xcode-version.txt
            iphoneos-sdk.txt
            frameworks.log
            resources.log
            packages.log
            xcodebuild.log
            submodules.txt
            bookmark-checks.log
            session-checks.log
            fileprovider-checks.log
            terminal-checks.log
            shortcuts-checks.log
            customization-checks.log
            blink-commit.txt
            prepared-source-changes.txt
            source-modified-files.txt
            sidestore-patch-files.txt
            source-patches.diff
            patched-source-SHA256SUMS
            patch-SHA256SUMS
            harness-source.tar.gz
          if-no-files-found: ignore
          retention-days: 14
