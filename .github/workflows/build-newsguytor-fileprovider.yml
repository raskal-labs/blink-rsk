name: Build native SideStore Blink File Provider candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep this candidate tied to the already-audited public Blink 18.7 source.
  BLINK_SOURCE_COMMIT: a90b4423c8b7a86770c24a7eaa6c13b0a5904b18
  BLINK_EXPECTED_VERSION: 18.7.0
  BLINK_EXPECTED_BUNDLE_ID: sh.blink.blinkshell
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select and verify Xcode
        run: |
          set -euxo pipefail
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          test "$(xcode-select -p)" = "$XCODE_DEVELOPER_DIR"
          xcodebuild -version | tee xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee iphoneos-sdk.txt

      - name: Prepare exact upstream source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/blinksh/blink.git blink
          git -C blink checkout --force "$BLINK_SOURCE_COMMIT"
          test "$(git -C blink rev-parse HEAD)" = "$BLINK_SOURCE_COMMIT"
          git -C blink submodule sync --recursive
          git -C blink submodule update --init --recursive
          printf '%s\n' "$BLINK_SOURCE_COMMIT" > blink-commit.txt
          git -C blink submodule status --recursive > submodules.txt

          cd blink
          ./get_frameworks.sh 2>&1 | tee ../frameworks.log
          ./get_resources.sh 2>&1 | tee ../resources.log
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/
          cp template_setup.xcconfig developer_setup.xcconfig
          cmp -s template_setup.xcconfig developer_setup.xcconfig
          # Resource preparation is an upstream build prerequisite and may
          # update tracked generated assets. Record that baseline so the next
          # step can prove that its only additional source edit is the resolver.
          git diff --name-only | sort > ../prepared-source-changes.txt

      - name: Apply and test the single SideStore source repair
        run: |
          set -euxo pipefail
          python3 scripts/patch-sidestore-app-groups.py "$GITHUB_WORKSPACE/blink"
          python3 scripts/test-sidestore-app-groups.py "$GITHUB_WORKSPACE/blink"
          git -C blink diff --check
          git -C blink diff --name-only | sort > source-modified-files.txt
          comm -13 prepared-source-changes.txt source-modified-files.txt > sidestore-patch-files.txt
          test "$(cat sidestore-patch-files.txt)" = "BlinkConfig/XCConfig.m"
          git -C blink diff --no-ext-diff --binary -- BlinkConfig/XCConfig.m > source-patches.diff

      - name: Resolve packages and build complete Release app
        working-directory: blink
        run: |
          set -o pipefail
          xcodebuild -project Blink.xcodeproj -scheme Blink \
            -clonedSourcePackagesDirPath ../SourcePackages \
            -resolvePackageDependencies 2>&1 | tee ../packages.log
          xcodebuild -project Blink.xcodeproj -scheme Blink \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ../DerivedData \
            -clonedSourcePackagesDirPath ../SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee ../xcodebuild.log

      - name: Stage complete app and sign SideStore capability requests
        run: |
          set -euxo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name Blink.app -print -quit)"
          test -n "$APP"
          rm -rf stage artifact
          mkdir -p stage/Payload artifact
          cp -R "$APP" stage/Payload/Blink.app
          APP="$GITHUB_WORKSPACE/stage/Payload/Blink.app"
          FP="$APP/PlugIns/BlinkFileProviderExtension.appex"
          FPUI="$APP/PlugIns/BlinkFileProviderExtensionUI.appex"
          test -d "$FP"
          test -d "$FPUI"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$APP" -type f -name embedded.mobileprovision -delete

          # SideSign filters profile entitlements through these pre-signing
          # requests. Both the app and non-UI File Provider must name the
          # same keychain suffix, otherwise the extension cannot read Blink's
          # credentials after SideStore has assigned its team prefix.
          cat > artifact/main-requested.entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.default-data-protection</key><string>NSFileProtectionComplete</string>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.application-groups</key><array><string>group.sh.blink</string></array>
            <key>com.apple.security.device.bluetooth</key><true/>
            <key>com.apple.security.device.camera</key><true/>
            <key>com.apple.security.files.user-selected.read-write</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
            <key>com.apple.security.personal-information.location</key><true/>
            <key>keychain-access-groups</key><array><string>PRE_SIGNING_PREFIX.sh.blink</string></array>
          </dict></plist>
          EOF
          cat > artifact/fileprovider-requested.entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.application-groups</key><array><string>group.sh.blink</string></array>
            <key>com.apple.security.network.client</key><true/>
            <key>keychain-access-groups</key><array><string>PRE_SIGNING_PREFIX.sh.blink</string></array>
          </dict></plist>
          EOF
          cat > artifact/fileprovider-ui-requested.entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.application-groups</key><array><string>group.sh.blink</string></array>
          </dict></plist>
          EOF
          plutil -lint artifact/*requested.entitlements.plist

          while IFS= read -r code; do codesign --force --sign - "$code"; done < <(find "$APP/Frameworks" -maxdepth 2 \( -name '*.framework' -o -name '*.dylib' \) -print | sort)
          codesign --force --sign - --entitlements artifact/fileprovider-requested.entitlements.plist "$FP"
          codesign --force --sign - --entitlements artifact/fileprovider-ui-requested.entitlements.plist "$FPUI"
          codesign --force --sign - --entitlements artifact/main-requested.entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee artifact/codesign-verify.txt

          codesign -d --entitlements :- "$APP" > artifact/main-embedded-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$FP" > artifact/fileprovider-embedded-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$FPUI" > artifact/fileprovider-ui-embedded-entitlements.plist 2>/dev/null
          for file in artifact/*embedded-entitlements.plist; do
            plutil -lint "$file"
            grep -q 'group.sh.blink' "$file"
          done
          for file in artifact/main-embedded-entitlements.plist artifact/fileprovider-embedded-entitlements.plist; do
            grep -q 'PRE_SIGNING_PREFIX.sh.blink' "$file"
          done

      - name: Validate and package candidate
        run: |
          set -euxo pipefail
          APP="$GITHUB_WORKSPACE/stage/Payload/Blink.app"
          FP="$APP/PlugIns/BlinkFileProviderExtension.appex"
          FPUI="$APP/PlugIns/BlinkFileProviderExtensionUI.appex"
          id() { /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$1/Info.plist"; }
          test "$(id "$APP")" = "$BLINK_EXPECTED_BUNDLE_ID"
          test "$(id "$FP")" = 'sh.blink.blinkshell.BlinkFileProviderExtension'
          test "$(id "$FPUI")" = 'sh.blink.blinkshell.BlinkFileProviderExtensionUI'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionFileProviderDocumentGroup' "$FP/Info.plist")" = 'group.sh.blink'
          test "$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')" = 2
          test -z "$(find "$APP" -type f -name embedded.mobileprovision -print -quit)"
          find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' -print | sort > artifact/extensions.txt
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          IPA="artifact/Blink-SideStore-${VERSION}-${BUILD}-native-fileprovider.ipa"
          (cd stage && zip -qry "../$IPA" Payload)
          unzip -t "$IPA"
          shasum -a 256 "$IPA" > artifact/SHA256SUMS
          cp blink-commit.txt source-patches.diff prepared-source-changes.txt source-modified-files.txt sidestore-patch-files.txt artifact/
          export VERSION BUILD
          python3 - <<'PY'
          import json, os
          json.dump({
            "schema": 2,
            "artifact": "Pinned upstream Blink with SideStore File Provider capability requests",
            "upstream_commit": open("blink-commit.txt").read().strip(),
            "version": os.environ["VERSION"], "build": os.environ["BUILD"],
            "source_changes": ["BlinkConfig/XCConfig.m: resolve the installed profile's one provisioned Blink App Group"],
            "side_store_contract": {
              "pre_signing_requests": "Main + File Provider share keychain suffix sh.blink and request group.sh.blink; SideStore supplies profile values and rewrites the File Provider document group.",
              "final_signer": "SideStore",
              "extensions": ["BlinkFileProviderExtension", "BlinkFileProviderExtensionUI"]
            },
            "migration_safety": "Upstream migrations are unchanged. Do not update an existing installation until its App Group state and a restorable backup have been verified."
          }, open("artifact/build-manifest.json", "w"), indent=2)
          PY

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-SideStore-native-fileprovider-${{ github.run_number }}
          path: |
            artifact/
            xcode-version.txt
            iphoneos-sdk.txt
            frameworks.log
            resources.log
            packages.log
            xcodebuild.log
            submodules.txt
          if-no-files-found: ignore
          retention-days: 14
