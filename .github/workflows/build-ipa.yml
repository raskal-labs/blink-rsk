name: Build upstream Blink baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Newest Blink 18.7 source currently exposed by the public upstream repo.
  # Pin the commit so this control build cannot silently move with branch raw.
  BLINK_SOURCE_BRANCH: raw
  BLINK_SOURCE_COMMIT: a90b4423c8b7a86770c24a7eaa6c13b0a5904b18
  BLINK_EXPECTED_VERSION: 18.7.0
  BLINK_EXPECTED_BUNDLE_ID: sh.blink.blinkshell
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout Blink-RSK harness
        uses: actions/checkout@v4

      - name: Select and verify Xcode
        run: |
          set -euxo pipefail
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          test "$(xcode-select -p)" = "$XCODE_DEVELOPER_DIR"
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone exact upstream source
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/blinksh/blink.git blink
          git -C blink checkout --force "$BLINK_SOURCE_COMMIT"
          test "$(git -C blink rev-parse HEAD)" = "$BLINK_SOURCE_COMMIT"
          git -C blink submodule sync --recursive
          git -C blink submodule update --init --recursive

          printf '%s\n' "$BLINK_SOURCE_COMMIT" | tee blink-commit.txt
          git -C blink submodule status --recursive | tee submodules.txt

          # This is a source identity check, not a project rewrite.
          grep -q "MARKETING_VERSION = ${BLINK_EXPECTED_VERSION};" blink/Blink.xcodeproj/project.pbxproj

      - name: Prepare upstream dependencies and resources
        working-directory: blink
        run: |
          set -euxo pipefail
          ./get_frameworks.sh 2>&1 | tee ../frameworks.log
          ./get_resources.sh 2>&1 | tee ../resources.log

          # Upstream README's documented source-build path removes this shared
          # workspace metadata before opening/building the Xcode project.
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

          # Use upstream's template unchanged. Do not append Blink-RSK settings:
          # this job is the control build of the complete upstream application.
          cp template_setup.xcconfig developer_setup.xcconfig
          cmp -s template_setup.xcconfig developer_setup.xcconfig

      - name: Resolve Xcode package dependencies
        working-directory: blink
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -clonedSourcePackagesDirPath ../SourcePackages \
            -resolvePackageDependencies \
            2>&1 | tee ../packages.log

      - name: Validate project and effective build settings
        working-directory: blink
        run: |
          set -euxo pipefail
          test -f Blink.xcodeproj/project.pbxproj
          xcodebuild -project Blink.xcodeproj -list | tee ../xcode-list.txt
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ../SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -showBuildSettings \
            > ../build-settings.txt

          grep -E '(^| )[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_ACTIVE_COMPILATION_CONDITIONS) =' ../build-settings.txt | head -n 80 || true

      - name: Build complete unsigned Release app
        working-directory: blink
        run: |
          set -o pipefail
          rm -rf ../DerivedData
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../DerivedData \
            -clonedSourcePackagesDirPath ../SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee ../xcodebuild.log

      - name: Assemble complete upstream SideStore IPA
        run: |
          set -euxo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'Blink.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          rm -rf stage artifact
          mkdir -p stage/Payload artifact
          cp -R "$APP" stage/Payload/Blink.app
          STAGED_APP="stage/Payload/Blink.app"

          # Remove only stale signing products. Preserve the complete application,
          # including File Provider extensions, for SideStore to re-sign.
          find "$STAGED_APP" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$STAGED_APP" -type f -name embedded.mobileprovision -delete

          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGED_APP/Info.plist")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$STAGED_APP/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$STAGED_APP/Info.plist")"

          test "$ACTUAL_ID" = "$BLINK_EXPECTED_BUNDLE_ID"
          test "$ACTUAL_VERSION" = "$BLINK_EXPECTED_VERSION"
          test -n "$ACTUAL_BUILD"

          EXTENSION_COUNT="$(find "$STAGED_APP" -type d -name '*.appex' | wc -l | tr -d ' ')"
          test "$EXTENSION_COUNT" -gt 0

          {
            printf 'main\t%s\n' "$ACTUAL_ID"
            while IFS= read -r bundle; do
              id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")"
              printf 'appex\t%s\n' "$id"
            done < <(find "$STAGED_APP" -type d -name '*.appex' | sort)
          } | tee artifact/embedded-bundles.txt

          file "$STAGED_APP/Blink"
          IPA="artifact/Blink-upstream-${ACTUAL_VERSION}-${ACTUAL_BUILD}-unsigned.ipa"
          (cd stage && zip -qry "../$IPA" Payload)
          unzip -t "$IPA"
          shasum -a 256 "$IPA" > artifact/SHA256SUMS

          printf '%s\n' "$ACTUAL_ID" > artifact/bundle-id.txt
          printf '%s\n' "$ACTUAL_VERSION" > artifact/blink-version.txt
          printf '%s\n' "$ACTUAL_BUILD" > artifact/blink-build.txt
          printf '%s\n' "$EXTENSION_COUNT" > artifact/extension-count.txt

          {
            echo "ACTUAL_VERSION=$ACTUAL_VERSION"
            echo "ACTUAL_BUILD=$ACTUAL_BUILD"
            echo "EXTENSION_COUNT=$EXTENSION_COUNT"
          } >> "$GITHUB_ENV"

      - name: Write provenance manifest
        run: |
          set -euxo pipefail
          export XCODE_VERSION="$(xcodebuild -version | tr '\n' ' ' | sed 's/ $//')"
          export SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - <<'PY'
          import json, os

          manifest = {
              "schema": 3,
              "artifact": "Blink upstream control",
              "stage": "complete-upstream-sideload-control",
              "upstream": {
                  "repository": "blinksh/blink",
                  "branch_at_selection": os.environ["BLINK_SOURCE_BRANCH"],
                  "commit": os.environ["BLINK_SOURCE_COMMIT"],
                  "version": os.environ["ACTUAL_VERSION"],
                  "build": os.environ["ACTUAL_BUILD"],
              },
              "blink_rsk_harness_commit": os.environ["GITHUB_SHA"],
              "bundle_id_before_sidestore": os.environ["BLINK_EXPECTED_BUNDLE_ID"],
              "configuration": "Release",
              "source_modified": False,
              "upstream_template_xcconfig": True,
              "signed": False,
              "app_extensions_stripped": False,
              "embedded_app_extensions": int(os.environ["EXTENSION_COUNT"]),
              "xcode": os.environ["XCODE_VERSION"],
              "iphoneos_sdk": os.environ["SDK_VERSION"],
              "runner": f'{os.environ.get("RUNNER_OS")}/{os.environ.get("RUNNER_ARCH")}',
              "packaging": "Complete Payload/Blink.app zipped unsigned; SideStore performs final signing and identifier/provisioning transforms",
          }
          with open("artifact/build-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY
          cat artifact/build-manifest.json
          cat artifact/SHA256SUMS

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-upstream-diagnostics-${{ github.run_number }}
          path: |
            blink-commit.txt
            submodules.txt
            frameworks.log
            resources.log
            packages.log
            xcode-list.txt
            build-settings.txt
            xcodebuild.log
            blink/Blink.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload complete unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-upstream-${{ env.ACTUAL_VERSION }}-${{ env.ACTUAL_BUILD }}-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
